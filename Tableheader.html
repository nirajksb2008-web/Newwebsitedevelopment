<!DOCTYPE html>
<html><header>
    <title>Complete tutorial of Table Tags</title>
</header>
<body>
    <h1>Tutorial of Table tag.</h1>
    <hr>

    <table Border="2">
        <tr>
        <th><mark>Tag</mark></th>
        <th><mark>Description</mark></th>
        <th><mark>Example</mark></th>
        </tr>
        <tr>
            <td>&lt;Table&gt;</td>
            <td>Defines a table</td>
            <td>&lt;table&gt;.....&lt;/table&gt;</td>
        </tr>
        <tr>
            <td>&lt;th&gt;</td>
            <td>Table header cell</td>
            <td>&lt;th&gt;Heading&lt;/thgt;</td>
        </tr>
         <tr>
            <td>&lt;tr&gt;</td>
            <td>Table row</td>
            <td>&lt;tr&gt;......&lt;/thgt;</td>
        </tr>
        <tr>
            <td>&lt;td&gt;</td>
            <td>Table data cell</td>
            <td>&lt;td&gtData&lt;/d&gt;</td>
        </tr>
    </table>
</body>
</html>
