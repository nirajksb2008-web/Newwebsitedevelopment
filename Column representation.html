<!DOCTYPE html>
<html>
    <header><title>Complete structure of Column.</title></header>

    <body>
        <h2>Name of Birds in English and Hindi</h2>
        <hr>
        <table Border="5" Width="100%">
            <caption><strong>English and Hindi name of Birds</strong></caption>
            <colgroup>
                <col span="1" style="background-color:red;">
                <col span="1" style="background-color:blue;">
                <col span="1" style="background-color:chartreuse;">
            </colgroup>
            <thead>
                <tr>
                   <th>English name of Bird</th>
                   <th>Hindi name of Bird</th>
                   <th>Picture of Bird</th>
                   
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="text-align:center;">Sparrow</td>
                    <td style="text-align:center;">गौरैया</td>
                    <td style="text-align:center;"><img src="image.jpeg" alt="Sparrow"></td>
                </tr>
                <tr>
                    <td style="text-align:center;">Peacock</td>
                    <td style="text-align:center;">मोर</td>
                    <td style="text-align:center;"><img src="image.jpeg" alt="Peacock image></td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
